<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>弹幕桥</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span>弹幕桥</span><small>B站 → YouTube · 0.1.4</small></header>
<p>保留 B 站直播间标签页，将新文字弹幕显示在当前 YouTube 视频上。</p>
<label>YouTube 页面<select id="target"></select></label>
<label>B 站直播间<select id="source"></select></label>
<div class="buttons"><button id="bind">连接直播间</button><button id="unbind" class="secondary">断开</button></div>
<div id="status" role="status">正在读取…</div>
<label class="toggle"><span>显示弹幕</span><input id="enabled" type="checkbox"></label>
<label>字号 <output id="fontSizeValue"></output><input id="fontSize" type="range" min="16" max="48"></label>
<label>透明度 <output id="opacityValue"></output><input id="opacity" type="range" min="20" max="100"></label>
<label>滚动时长 <output id="durationValue"></output><input id="duration" type="range" min="5" max="20"></label>
<label>显示区域 <output id="areaValue"></output><input id="area" type="range" min="20" max="100"></label>
<label class="toggle"><span>显示发送者昵称</span><input id="showUser" type="checkbox"></label>
<button id="demo" class="secondary wide">发送测试弹幕</button><p class="hint">弹幕仅在本机转发；表情图片从 B 站图片 CDN 下载。B 站聊天区域须正常加载；可将直播静音。</p>
<script src="popup.js"></script></body></html>
